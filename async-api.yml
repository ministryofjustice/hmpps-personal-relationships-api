asyncapi: 3.0.0
info:
  title: Personal Relationships API
  description: Publishes events relating to contacts, prisoner relationships, restrictions, domestic status and number of children.
  version: 1.0.0

defaultContentType: application/json

servers:
  development:
    host: hmpps-domain-events-dev.live-1.cloud-platform.service.justice.gov.uk
    protocol: sns
    description: Development environment
  preproduction:
    host: hmpps-domain-events-preprod.live-1.cloud-platform.service.justice.gov.uk
    protocol: sns
    description: Pre-production environment
  production:
    host: hmpps-domain-events-prod.live-1.cloud-platform.service.justice.gov.uk
    protocol: sns
    description: Production environment

